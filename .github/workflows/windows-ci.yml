name: Windows CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  core-tests:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore core tests
        run: dotnet restore tests/Meridian.Core.Tests/Meridian.Core.Tests.csproj
      - name: Test core library
        run: dotnet test tests/Meridian.Core.Tests/Meridian.Core.Tests.csproj --configuration Release --logger "trx;LogFileName=core-tests.trx" --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meridian-core-test-results
          path: TestResults/*.trx
          if-no-files-found: warn
          retention-days: 14

  app-build:
    name: Build Windows 11 (${{ matrix.architecture }})
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runtime: win-x64
            inno_arch: x64
          - architecture: ARM64
            runtime: win-arm64
            inno_arch: arm64
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore Windows app for target architecture
        run: dotnet restore src/Meridian.App/Meridian.App.csproj -p:Platform=${{ matrix.architecture }} -p:RuntimeIdentifier=${{ matrix.runtime }}
      - name: Compile Windows app before packaging
        run: dotnet build src/Meridian.App/Meridian.App.csproj --configuration Release --no-restore -p:Platform=${{ matrix.architecture }} -p:RuntimeIdentifier=${{ matrix.runtime }}
      - name: Publish Windows 11 app (${{ matrix.runtime }})
        run: dotnet publish src/Meridian.App/Meridian.App.csproj --configuration Release --runtime ${{ matrix.runtime }} --self-contained true -p:Platform=${{ matrix.architecture }}

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build per-user Windows installer
        shell: pwsh
        run: |
          $publish = "src/Meridian.App/bin/${{ matrix.architecture }}/Release/net10.0-windows10.0.22000.0/${{ matrix.runtime }}/publish"
          $out = "artifacts"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $publishPath = (Resolve-Path $publish).Path
          $outputPath = (Resolve-Path $out).Path
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "packaging/Meridian.iss" "/DPublishDir=$publishPath" "/DOutputDir=$outputPath" "/DAllowedArch=${{ matrix.inno_arch }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installable Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: meridian-installer-${{ matrix.runtime }}
          path: artifacts/Meridian-Setup-win-${{ matrix.inno_arch }}.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload portable publish output
        uses: actions/upload-artifact@v4
        with:
          name: meridian-portable-${{ matrix.runtime }}
          path: src/Meridian.App/bin/${{ matrix.architecture }}/Release/net10.0-windows10.0.22000.0/${{ matrix.runtime }}/publish/
          if-no-files-found: error
          retention-days: 14
