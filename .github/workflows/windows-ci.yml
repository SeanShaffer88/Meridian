name: Windows CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  core-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test core library
        run: dotnet test tests/Meridian.Core.Tests/Meridian.Core.Tests.csproj --configuration Release

  app-build:
    name: Build Windows 11 (${{ matrix.architecture }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runtime: win-x64
          - architecture: ARM64
            runtime: win-arm64
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore solution
        run: dotnet restore Meridian.sln
      - name: Publish Windows 11 app (${{ matrix.runtime }})
        run: dotnet publish src/Meridian.App/Meridian.App.csproj --configuration Release --runtime ${{ matrix.runtime }} --self-contained true -p:Platform=${{ matrix.architecture }}

      - name: Upload portable publish output
        uses: actions/upload-artifact@v4
        with:
          name: meridian-portable-${{ matrix.runtime }}
          path: src/Meridian.App/bin/${{ matrix.architecture }}/Release/net10.0-windows10.0.22000.0/${{ matrix.runtime }}/publish/
          if-no-files-found: error
          retention-days: 14
