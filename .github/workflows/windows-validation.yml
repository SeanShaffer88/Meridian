name: Windows build and core tests

on:
  push:
    branches:
      - feature/timevault-foundation
  workflow_dispatch:

concurrency:
  group: windows-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore core tests
        run: dotnet restore tests/Meridian.Core.Tests/Meridian.Core.Tests.csproj --locked-mode
      - name: Build core tests
        run: dotnet build tests/Meridian.Core.Tests/Meridian.Core.Tests.csproj --no-restore --configuration Release
      - name: Run core tests
        run: dotnet test tests/Meridian.Core.Tests/Meridian.Core.Tests.csproj --no-build --no-restore --configuration Release --logger trx
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  windows-app:
    name: Validate Windows app (${{ matrix.architecture }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runtime: win-x64
          - architecture: ARM64
            runtime: win-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore Windows app
        run: dotnet restore src/Meridian.App/Meridian.App.csproj --locked-mode -p:RuntimeIdentifier=${{ matrix.runtime }} -p:Platform=${{ matrix.architecture }} -p:SelfContained=true
      - name: Build Windows app
        run: dotnet build src/Meridian.App/Meridian.App.csproj --no-restore --configuration Release -p:RuntimeIdentifier=${{ matrix.runtime }} -p:Platform=${{ matrix.architecture }} -p:SelfContained=true
